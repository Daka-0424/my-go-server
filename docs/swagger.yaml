definitions:
  response.AppError:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  response.User:
    properties:
      id:
        type: integer
      name:
        type: string
      user_kind:
        type: integer
      uuid:
        type: string
    type: object
info:
  contact: {}
  description: This is a sample server for My Go Server API.
  title: My Go Server API
  version: "1"
paths:
  /api/registration:
    post:
      consumes:
      - application/json
      description: Register a new user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.AppError'
      summary: User Registration
      tags:
      - User
securityDefinitions:
  Bearer:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
